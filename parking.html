<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Зогсоол</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="admin">

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🌿 GreenPark</h2>
    <a href="dashboard.html">📊 Хянах самбар</a>
    <a href="parking.html">📍 Зогсоол</a>
    <a href="users.html">👤 Хэрэглэгчид</a>
    <a onclick="logout()">🚪 Гарах</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="header">
      <h1>Зогсоолын хэсэг</h1>
      <button class="primary" onclick="openModal()">+ Зогсоол нэмэх</button>
    </div>

    <!-- TABLE -->
    <table>
      <thead>
        <tr>
          <th>Нэр</th>
          <th>Бүс</th>
          <th>Үнэ</th>
          <th>Хаяг</th>
          <th>Нийт багтаамж</th>
          <th>Үйлдэл</th>
        </tr>
      </thead>

      <tbody id="parkingTable"></tbody>
    </table>

  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h2>Зогсоол нэмэх / засах</h2>

    <input id="name" placeholder="Жишээ: A-101">
    
    <select id="zone">
      <option value="A">A бүс</option>
      <option value="B">B бүс</option>
      <option value="C">C бүс</option>
    </select>

    <input id="price" placeholder="Үнэ">
    <input id="total" placeholder="Нийт зогсоол">
    <input id="address" placeholder="Хаяг (жишээ: СБД, 1-р хороо)">

    <div class="modal-actions">
      <button onclick="createSpot()">Хадгалах</button>
      <button onclick="closeModal()">Цуцлах</button>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>

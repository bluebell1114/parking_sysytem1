<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Хэрэглэгчид</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>🌿 GreenPark</h2>
    <a href="dashboard.html">📊 Хянах самбар</a>
    <a href="users.html">👤 Хэрэглэгчид</a>
    <a href="parking.html">📍 Зогсоол</a>
    <a href="bookings.html">📅 Захиалгууд</a>
    <a onclick="logout()">🚪 Гарах</a>
  </div>

  <div class="main">
    <h1>Мобайл аппын хэрэглэгчид</h1>
    <p>Апп дээр бүртгүүлсэн бүх акаунт (Docker <code>mobile_bas2</code> → PostgreSQL)</p>

    <table>
      <tr>
        <th>Нэр</th>
        <th>Имэйл</th>
        <th>Бүртгүүлсэн</th>
      </tr>
      <tbody id="usersTable"></tbody>
    </table>
  </div>

</div>

<!-- User details modal -->
<div id="userModal" class="modal" onclick="closeUserModal(event)">
  <div class="modal-content" style="width: min(720px, 92vw);" onclick="event.stopPropagation()">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <h2 style="margin:0;">Хэрэглэгчийн дэлгэрэнгүй</h2>
      <button type="button" onclick="closeUserModal()">Хаах</button>
    </div>
    <div id="userModalBody" style="margin-top:12px;">
      <!-- filled by js -->
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>

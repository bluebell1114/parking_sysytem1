<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Зогсоол</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet (OSM) for picking spot location -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🌿 GreenPark</h2>
    <a href="dashboard.html">📊 Хянах самбар</a>
    <a href="users.html">👤 Хэрэглэгчид</a>
    <a href="parking.html">📍 Зогсоол</a>
    <a href="bookings.html">📅 Захиалгууд</a>
    <a onclick="logout()">🚪 Гарах</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <h1>Зогсоолууд</h1>
    <p>Зогсоолын мэдээллийг удирдах</p>

    <button class="btn" onclick="openModal()">+ Шинэ зогсоол нэмэх</button>

    <table>
      <tr>
        <th>Нэр</th>
        <th>Үнэ (цаг)</th>
        <th>Нийт</th>
        <th>Үйлдэл</th>
      </tr>
      <tbody id="parkingTable"></tbody>
    </table>

  </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Шинэ зогсоол нэмэх</h2>
      <span onclick="closeModal()">✖</span>
    </div>

    <p class="subtitle">Мэдээллээ бөглөнө үү</p>

    <div class="form-row">
      <input id="name" placeholder="Нэр">
      <input id="price" placeholder="Үнэ (цаг)">
    </div>

    <input id="address" placeholder="Хаяг">

    <div class="form-row">
      <input id="total" placeholder="Нийт зогсоол">
      <input id="available" placeholder="Сул зогсоол">
    </div>

    <!-- Coordinates are selected from the map; keep as hidden inputs for JS -->
    <input id="lat" type="hidden" value="">
    <input id="lng" type="hidden" value="">
    <div
      id="spotMap"
      style="height:240px;border-radius:12px;overflow:hidden;margin-top:10px;border:1px solid rgba(255,255,255,.12)"
    ></div>
    <p class="subtitle" style="font-size:12px;opacity:0.85;margin-top:8px;">
      Газрын зураг дээр дарж байрлалаа сонгоно уу (lat/lng автоматаар бөглөгдөнө).
    </p>

    <div class="modal-actions">
      <button onclick="createSpot()">Үүсгэх</button>
      <button class="cancel" onclick="closeModal()">Цуцлах</button>
    </div>

  </div>
</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script src="js/app.js"></script>
</body>
</html>

# Төсөл: mobile_bas2 — PostgreSQL + REST API (Firebase-гүй хэрэглэгч / байршил / зогсоол / төлбөр)
# Ажиллуулах: энэ хавтас дээр `docker compose up --build -d`
# API: http://localhost:4000  |  DB: localhost:5434 (parking / parking)

name: mobile_bas2

services:
  db:
    image: postgres:16-alpine
    container_name: mobile_bas2_postgres
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking_db
    ports:
      - "5434:5432"
    volumes:
      - mobile_bas2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: mobile_bas2_api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://parking:parking@db:5432/parking_db
      JWT_SECRET: mobile-bas2-change-in-production
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mobile_bas2_pgdata:
